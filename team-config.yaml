  drive_left_front: {value: "lf", source: asked, confirmed: true}
  drive_left_back: {value: "lb", source: asked, confirmed: true}
  drive_right_front: {value: "rf", source: asked, confirmed: true}
  drive_right_back: {value: "rb", source: asked, confirmed: true}
