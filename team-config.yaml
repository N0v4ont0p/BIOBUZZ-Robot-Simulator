  - {field: MatchState.pose, written_by: auto, read_by: teleop, required_before_read: true, staleness_guard: "null until auto runs; teleop falls back to reseed", confirmed: true}

reference_frames:
  pedro3_field:
    source: "Pedro Pathing 3.0 field frame, as drawn by Pedro-Pathing/visualizer (BIOBUZZ field image)"
    definition_ref: "pedro-visualizer src/App.svelte:2367-2380 (x scale left->right, y scale inverted so y=0 at bottom); utils/headingInterpolation.ts:251 (heading = atan2(dy, dx))"
    x_positive: right
    y_positive: forward
    heading_zero: "+x, facing the blue ALLIANCE wall; counter-clockwise positive"
    units: in
    confirmed: true
    notes: >
      Directions are as seen from the audience. Origin (0,0) = corner at the red ALLIANCE wall
      and the audience wall (red GARDEN corner). +x = from red side toward blue side;
      +y = from the red GARDEN (audience) wall toward the blue GARDEN (far) wall. Stated by
      the team and matches the visualizer source. BIOBUZZ is 180-degree rotationally
      symmetric: red <-> blue is (x, y, h) -> (144-x, 144-y, h+180). Do NOT use the
      visualizer's mirrorX export option for alliance flipping; that is DECODE-style mirroring.

  robot_body:
    source: "team convention, docs/BIOBUZZ_PREREQUISITES.md section 0"
    x_positive: forward
    y_positive: left
    heading_zero: "robot forward; counter-clockwise (seen from above) positive"
    units: in
    confirmed: true
    notes: "origin = centre of the 4 wheel contact points; front = intake / NECTAR launcher side"
  pedro3_pinpoint:
    source: "Pedro 3.0 PinpointTuner output convention (values copied verbatim from the tuner)"
    x_positive: unknown
    y_positive: unknown
    heading_zero: "n/a (pod offsets)"
    units: in
    confirmed: true

  _conversions:
    - {from: robot_body, to: pedro3_field, status: declared, confirmed: true,
       transform: "p_field = (pose.x, pose.y) + R(pose.heading) * (x_body, y_body); heading_field = pose.heading + heading_body. Applied explicitly in AutoAim/Field code"}

