_meta:
  schema: 1
  updated: 2026-10-03
  suite_generated_code: true
  season: biobuzz-2026-27
  season_source: BIOBUZZ_Competition_Manual_V1.pdf (173 pp, 2026-09-12)
  validation_gap: >
    validate_config.py validates against season-extensions/ACTIVE, which still reads
    decode-2025-26, and the biobuzz-2026-27 extension is a pre-kickoff DRAFT whose
    mechanism axes are UNKNOWN. season_mechanisms below are grounded in the V1 manual
    and the team's answers, but no validator run can confirm them until that extension
    is rebuilt from the manual and made ACTIVE. Treat generation_allowed as NOT established.
  actuator_budget: >
    BIOBUZZ R503 caps 8 motors + 8 servos (DECODE allowed 10 servos). Motors 8 = 4 drive
    + 1 intake + 2 flywheel + 1 yaw motor geared to BOTH turrets: exactly at the cap, zero
    spare. Servos 5 = 2 hood + 1 ramp + 2 feed gates (one per launcher, team 2026-10-05, expected).
  dev_tools: >
    FTControl Panels (com.bylazar:fullpanels) installed for practice/tuning only. R704 bans
    Panels/Dashboard streaming during matches: competition OpModes must not use it.
    No powered motion in INIT (R102/G403): confirmed by team.
  device_map_pending: >
    Robot is CAD-only with no Robot Controller configuration. Ask for the exact
    hardwareMap strings once wired; do not propose a naming convention.

team:
  number: {value: 19859, source: asked, confirmed: true}
  experience: {value: veteran, source: asked, confirmed: true}
  predecessor: {value: null, source: asked, confirmed: false}

drivetrain:
  type: {value: mecanum, source: asked, confirmed: true}
  mecanum:
    wheel_source: {value: unknown, source: inferred, confirmed: false}
    wheel_diameter_mm: {value: unknown, source: inferred, confirmed: false}
    wheel_durometer: {value: unknown, source: inferred, confirmed: false}

control_hardware:
  hub_generation: {value: REV_Control_Hub, source: inferred, confirmed: true}
  # time-gated: manual R701 makes the REV Control Hub the controller for 2026-27; no info gain in asking
  expansion_hub_count:
    value: 1
    source: inferred
    confirmed: false
    notes: 8 motors exceeds the Control Hub's 4 motor ports; R701 allows at most one Expansion Hub

sensing:
  vision: {value: none, source: asked, confirmed: true}
  odometry:
    value: goBILDA_pinpoint
    source: asked
    confirmed: true
    notes: goBILDA 4-bar pods (goBILDA_4_BAR_POD), same as DECODE; confirmed 2026-10-03

software_stack:
  pathing:
    value: pedro_pathing
    source: asked
    confirmed: true
    notes: >
      Latest Pedro: com.pedropathing:revhub:3.0.1 + tuning:1.0.1 on FTC SDK 12.0.0.
      Pedro 3.0 API (Follower(localizer, drivetrain, algorithm), MecanumConfig,
      PinpointConfig, ForesightConfig, Paths.line/curve, math.Pose). DECODE code is
      Pedro 2.1.2 (FollowerBuilder/FollowerConstants/geometry.Pose) and must be ported.
  opmode_style: {value: raw_linear_opmode, source: asked, confirmed: true}
  # raw OpMode/LinearOpMode with enum state machines, as DECODE
  behavior_layer: {value: none, source: inferred, confirmed: false}

season_mechanisms:
  # Keys match the biobuzz-2026-27 extension requested from the refract plugin; they fail
  # validation until that extension exists and is selected (see _meta.validation_gap).
  intake: {value: roller, source: asked, confirmed: true, notes: "vectored roller, like DECODE"}
  element_handling: {value: pollen_and_nectar, source: asked, confirmed: true, notes: "own NECTAR only (G408)"}
  element_sorting: {value: passive, source: asked, confirmed: true, notes: "size filter: 2.8 in POLLEN vs 3.6 in NECTAR"}
  launcher:
    value: flywheel
    source: asked
    confirmed: true
    notes: "1 flywheel motor + 1 hood servo per launcher; front launches NECTAR, back launches POLLEN"
  launcher_count: {value: 2, source: asked, confirmed: true}
  turret:
    value: multi_axis
    source: asked
    confirmed: true
    notes: >
      Yaw + hood per launcher. ONE yaw motor geared to drive BOTH turrets (not independent).
      Shared yaw cannot correct parallax between the two pivots; aim must be solved for the
      launcher that is firing. Gear ratio/encoder placement not yet known.
  flower_placement: {value: none, source: asked, confirmed: true}
  flower_retrieval: {value: present, source: asked, confirmed: true, notes: "servo-deployed ramp, POLLEN only from FLOWER bottom (G418)"}
  garden_herding: {value: none, source: asked, confirmed: true}
  endgame_parking: {value: loading_zone, source: asked, confirmed: true, notes: "LOADING ZONE is the only PARK scoring zone (10.5.4)"}
  # hive target = own CELL on the robot's side of y = 72 (frame crossbar); start state red audience
  # CELL up, blue far CELL up. Feed = intake motor pushes both launchers at once through one gate each.

fabrication:
  capability: {value: cnc_aluminum_or_carbon, source: asked, confirmed: true}

